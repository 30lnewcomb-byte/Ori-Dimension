name: Geometry dataset checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate sample dataset
        run: python -m src.geometry.generate_dataset --output data/generated/ci-sample.jsonl --count 1000 --seed 42
      - name: Validate sample dataset
        run: python -m src.geometry.validate_dataset data/generated/ci-sample.jsonl
